<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lock.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary:   #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary:  #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --font:      "Space Grotesk", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 80px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 75% 18%, rgba(107,227,164,0.10), transparent 42%),
    radial-gradient(circle at 20% 80%, rgba(124,186,252,0.08), transparent 48%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 200px 200px;
  opacity: 0.022; mix-blend-mode: overlay;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

.dash-title {
  margin: 0 0 14px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== Live metrics ticker ===== */
.metrics-ticker {
  display: flex; align-items: center;
  gap: 10px;
  overflow: hidden;
  padding: 7px 12px;
  margin-bottom: 18px;
  border-radius: 12px;
  background: rgba(0,0,0,0.38);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}
.metrics-ticker.hidden { display: none; }
.metrics-ticker-badge {
  display: inline-flex; align-items: center; gap: 5px;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.metrics-led {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px rgba(107,227,164,0.8);
  animation: metricsLed 2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes metricsLed {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.8); }
}
.metrics-viewport {
  overflow: hidden; flex: 1; height: 20px; position: relative;
}
.metrics-track {
  display: flex; align-items: center;
  white-space: nowrap;
  animation: metricsScroll 32s linear infinite;
  will-change: transform;
}
.metrics-track:hover { animation-play-state: paused; }
@keyframes metricsScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.metrics-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 20px;
  font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}
.metrics-item-label {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-tertiary);
}
.metrics-item-val { color: var(--text-primary); }
.metrics-sep {
  display: inline-block; width: 1px; height: 12px;
  background: rgba(255,255,255,0.08);
}

/* ===== Bento grid ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 18px;
  border-radius: 18px;
  background: linear-gradient(
    145deg,
    color-mix(in srgb, var(--accent) 13%, #0a0a0c) 0%,
    #0d0d0f 75%
  );
  border: 1px solid color-mix(in srgb, var(--accent) 28%, rgba(255,255,255,0.06));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  text-decoration: none;
  overflow: hidden;
  transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), border-color 0.18s, box-shadow 0.18s;
  will-change: transform;
  opacity: 0;
  animation: tileIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes tileIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.tile:nth-child(1) { animation-delay: 0ms; }
.tile:nth-child(2) { animation-delay: 55ms; }
.tile:nth-child(3) { animation-delay: 110ms; }
.tile:nth-child(4) { animation-delay: 165ms; }
.tile:nth-child(5) { animation-delay: 220ms; }
.tile:nth-child(6) { animation-delay: 275ms; }

.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 10px 36px rgba(0,0,0,0.45), 0 0 28px color-mix(in srgb, var(--accent) 10%, transparent);
}
.tile:active { transform: translateY(-1px); }

.big  { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }

.tile-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--text-tertiary);
  flex-shrink: 0;
}
.tile-emoji {
  position: absolute;
  top: 16px;
  right: 18px;
  font-size: 28px;
  line-height: 1;
  filter: drop-shadow(0 0 12px var(--accent));
  pointer-events: none;
  user-select: none;
}
.big .tile-emoji { font-size: 42px; top: 20px; right: 22px; }
.tile-spacer { flex: 1; min-height: 8px; }
.tile-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.big .tile-title { font-size: 22px; }
.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.tile-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  line-height: 1.35;
}
.tile-arrow {
  font-size: 15px;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
  transition: transform 0.18s cubic-bezier(0.22,1,0.36,1);
}
.tile:hover .tile-arrow { transform: translateX(4px); }

/* ===== Responsive ===== */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .big   { grid-row: span 1; }
}
@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; }
  .big, .wide { grid-column: span 1; }
}
</style>
</head>
<body>

<main class="page">
  <h1 class="dash-title">Dashboard</h1>

  <!-- Live metrics ticker — populated by JS below -->
  <div class="metrics-ticker hidden" id="metricsTicker">
    <div class="metrics-ticker-badge"><span class="metrics-led"></span>LIVE</div>
    <div class="metrics-viewport">
      <div class="metrics-track" id="metricsTrack"></div>
    </div>
  </div>

  <div class="bento">

    <a href="main.html" class="tile big" style="--accent:#6BE3A4">
      <span class="tile-num">·01</span>
      <span class="tile-emoji">🏠</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Main</div>
      <div class="tile-footer">
        <span class="tile-sub">Goals & daily plan</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="gym.html" class="tile wide" style="--accent:#7DD3FC">
      <span class="tile-num">·02</span>
      <span class="tile-emoji">💪</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Fitness</div>
      <div class="tile-footer">
        <span class="tile-sub">Progressive overload coach</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="health.html" class="tile" style="--accent:#A7F3D0">
      <span class="tile-num">·03</span>
      <span class="tile-emoji">💊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Health</div>
      <div class="tile-footer">
        <span class="tile-sub">Garmin & vitals</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="progress.html" class="tile" style="--accent:#C084FC">
      <span class="tile-num">·04</span>
      <span class="tile-emoji">📸</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Progress</div>
      <div class="tile-footer">
        <span class="tile-sub">Weight & photos</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="finance.html" class="tile wide" style="--accent:#F2C063">
      <span class="tile-num">·05</span>
      <span class="tile-emoji">📊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Finance</div>
      <div class="tile-footer">
        <span class="tile-sub">Net worth & spending</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="po-water.html" class="tile" style="--accent:#60A5FA">
      <span class="tile-num">·06</span>
      <span class="tile-emoji">💧</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Water</div>
      <div class="tile-footer">
        <span class="tile-sub">Hydration</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

  </div>
</main>

<script>
(function () {
  const SUPABASE_URL = 'https://ktqywwwrszmkwznhakbw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ru0xehlRpZQbSLLyeB9FHQ_T6ZAonPm';

  function buildTicker(garminRow) {
    const items = [];

    // Water
    try {
      const wd = JSON.parse(localStorage.getItem('po_water_v1') || '{}');
      const today = new Date().toISOString().slice(0, 10);
      const done = (wd.logs || {})[today] || 0;
      let unitVol = wd.unit === 'glass' ? (wd.glassMl || 250)
                  : wd.unit === 'oz'    ? 30
                  : wd.unit === 'ml'    ? 1
                  :                       (wd.bottleMl || 500);
      const wKg = wd.weightUnit === 'lb'
        ? ((wd.profile || {}).weightKg || 75) / 2.20462
        : ((wd.profile || {}).weightKg || 75);
      const total = Math.max(1, Math.ceil(wKg * 35 / unitVol));
      if (done > 0 || total > 0) items.push({ label: 'WATER', val: done + '/' + total });
    } catch (e) {}

    // Gym — check po_coach_v1
    try {
      const gd = JSON.parse(localStorage.getItem('po_coach_v1') || '{}');
      const today = new Date().toISOString().slice(0, 10);
      let todayDone = false;
      const logs = gd.logs || {};
      Object.values(logs).forEach(exLogs => {
        if (Array.isArray(exLogs)) exLogs.forEach(l => {
          if (l && String(l.date || '').slice(0, 10) === today) todayDone = true;
        });
      });
      if (gd.logs) items.push({ label: 'GYM', val: todayDone ? '✓ Done' : 'Not logged' });
    } catch (e) {}

    // Finance
    try {
      const fd = JSON.parse(localStorage.getItem('finance_standalone_v1') || '{}');
      const nw = fd.netWorth != null ? fd.netWorth : (fd.accounts || []).reduce((s, a) => s + (a.balance || 0), 0);
      if (nw !== 0 || fd.netWorth != null) {
        const fmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(nw);
        items.push({ label: 'NET WORTH', val: fmt });
      }
    } catch (e) {}

    // Garmin from Supabase
    if (garminRow) {
      if (garminRow.body_battery != null) items.push({ label: 'BODY BAT', val: garminRow.body_battery + '%' });
      if (garminRow.sleep_score  != null) items.push({ label: 'SLEEP',    val: garminRow.sleep_score + '/100' });
      if (garminRow.resting_hr   != null) items.push({ label: 'RHR',      val: garminRow.resting_hr + ' bpm' });
      if (garminRow.avg_stress   != null) items.push({ label: 'STRESS',   val: garminRow.avg_stress + '/100' });
    }

    if (!items.length) return;

    const ticker = document.getElementById('metricsTicker');
    const track  = document.getElementById('metricsTrack');
    if (!ticker || !track) return;

    ticker.classList.remove('hidden');
    // Duplicate items for seamless loop
    const doubled = items.concat(items);
    track.innerHTML = doubled.map(it =>
      '<span class="metrics-item">'
      + '<span class="metrics-item-label">' + it.label + '</span>'
      + '<span class="metrics-sep"></span>'
      + '<span class="metrics-item-val">' + it.val + '</span>'
      + '</span>'
    ).join('');

    // Adjust animation duration based on item count so speed feels constant
    track.style.animationDuration = (items.length * 4.5) + 's';
  }

  // Load without Garmin first, then update when Supabase responds
  buildTicker(null);

  (async function () {
    try {
      if (!window.supabase) return;
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const today = new Date().toISOString().slice(0, 10);
      const { data } = await client
        .from('garmin_daily')
        .select('body_battery,sleep_score,resting_hr,avg_stress')
        .eq('date', today)
        .maybeSingle();
      if (data) buildTicker(data);
    } catch (e) {}
  })();
})();
</script>

</body>
</html>
